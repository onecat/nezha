name: Managed Agent upgrade - development checks
on:
  push:
    branches: [agent-upgrade-v0.30.06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-verification:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify package security and offline tool
        run: |
          go test -race -count=1 -v ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
          go vet ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
  dashboard-storage:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify real SQLite task persistence
        run: |
          go test -race -count=1 -v ./service/agentupgrade
          go vet ./service/agentupgrade ./service/upgradecontrol
          go test -count=1 ./cmd/dashboard/controller ./service/upgradecontrol
          go build ./cmd/dashboard

  joint-upgrade:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: onecat/nezha-agent
          ref: 718ff36ee1975e05377cbd2d93e62df2309f9b88
          path: joint-agent
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor exact frontend assets before candidate build
        run: python3 script/vendor-assets.py
      - name: Install isolated test proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils
      - name: Build exact paired source revisions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/joint-bin"
          go build -mod=readonly -trimpath -ldflags="-X github.com/naiba/nezha/service/singleton.Version=v0.30.06" -o "$RUNNER_TEMP/joint-bin/dashboard" ./cmd/dashboard
          test "$("$RUNNER_TEMP/joint-bin/dashboard" -v)" = v0.30.06
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/agent-package" ./cmd/agent-package
          cd joint-agent
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/supervisor" ./cmd/supervisor
          for version in v0.30.00 v0.30.01 v0.30.03; do
            go build -mod=readonly -ldflags="-X main.version=$version" -o "$RUNNER_TEMP/joint-bin/agent-$version" ./cmd/agent
          done
      - name: Actual Dashboard and Supervisor over TLS
        run: python3 script/managed-upgrade-joint.py "$RUNNER_TEMP/joint-bin" "$(go env GOARCH)"
      - name: Stage exact tested candidate binaries (unsigned)
        run: |
          set -eu
          arch=$(go env GOARCH)
          mkdir -p candidate
          cp "$RUNNER_TEMP/joint-bin/dashboard" candidate/nezha-dashboard
          cp "$RUNNER_TEMP/joint-bin/agent-package" candidate/agent-package
          cp "$RUNNER_TEMP/joint-bin/supervisor" candidate/nezha-supervisor
          cp "$RUNNER_TEMP/joint-bin/agent-v0.30.00" candidate/nezha-agent-v0.30.00
          cp "$RUNNER_TEMP/joint-bin/agent-v0.30.01" candidate/nezha-agent-v0.30.01
          cp joint-agent/deploy/nezha-supervisor.service candidate/
          cp joint-agent/docs/linux-deployment.md candidate/
          cp docs/managed-upgrade-control.md docs/managed-upgrade-proxy.md docs/managed-upgrade-operations.md candidate/
          cp LICENSE candidate/LICENSE-dashboard
          cp joint-agent/LICENSE candidate/LICENSE-agent
          printf 'Dashboard=%s\nAgent=%s\nPlatform=linux/%s\nGo=%s\n' "$GITHUB_SHA" "$(git -C joint-agent rev-parse HEAD)" "$arch" "$(go version)" > candidate/SOURCES.txt
          (cd candidate && sha256sum * > SHA256SUMS)
          tar -C candidate -czf "nezha-test-candidate-linux-$arch.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-test-candidate-${{ matrix.os }}
          path: nezha-test-candidate-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  security-regression:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned frontend assets
        run: python3 script/vendor-assets.py
      - name: Verify module integrity and lock
        run: |
          go mod verify
          go mod tidy -diff
      - name: Full regression and vet
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Reachable Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Frontend advisory disposition
        run: |
          python3 script/audit-frontend.py || test -s frontend-audit.json
          python3 script/check-frontend-disposition.py

  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/agent-upgrade-v0.30.06' && github.event.head_commit.message == 'release: qualify and publish Dashboard v0.30.06'
    needs: [package-verification, dashboard-storage, joint-upgrade, security-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-test-candidate-ubuntu-24.04
          path: paired-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-test-candidate-ubuntu-24.04-arm
          path: paired-artifacts
      - name: Verify and stage exact native tested binaries
        run: |
          set -eu
          mkdir -p release-dist
          for arch in amd64 arm64; do
            temp=$(mktemp -d)
            tar -xzf "paired-artifacts/nezha-test-candidate-linux-$arch.tar.gz" -C "$temp"
            (cd "$temp" && sha256sum -c SHA256SUMS)
            grep -Fx "Dashboard=$GITHUB_SHA" "$temp/SOURCES.txt"
            grep -Fx "Agent=718ff36ee1975e05377cbd2d93e62df2309f9b88" "$temp/SOURCES.txt"
            grep -Fx "Platform=linux/$arch" "$temp/SOURCES.txt"
            if [ "$arch" = amd64 ]; then
              test "$("$temp/nezha-dashboard" -v)" = v0.30.06
              install -m 0755 "$temp/nezha-dashboard" release-dist/nezha-app
            else
              install -m 0755 "$temp/nezha-dashboard" release-dist/nezha-app-linux-arm64
            fi
            # v0.30.01 is a version-labelled test fixture, not a separate release.
            rm "$temp/nezha-agent-v0.30.01" "$temp/nezha-dashboard" "$temp/SHA256SUMS"
            mv "$temp/nezha-agent-v0.30.00" "$temp/nezha-agent"
            (cd "$temp" && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
            tar -C "$temp" -czf "release-dist/managed-upgrade-v0.30.06-linux-$arch.tar.gz" .
            rm -rf "$temp"
          done
          (cd release-dist && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Confirm matching Agent release and publish Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # No cross-repository write token; verify the independent public release.
          for attempt in $(seq 1 30); do
            agent_sha=$(gh api repos/onecat/nezha-agent/git/ref/tags/v0.30.00 --jq '.object.sha' 2>/dev/null || true)
            agent_tag=$(gh api repos/onecat/nezha-agent/releases/tags/v0.30.00 --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)
            if [ "$agent_sha" = "718ff36ee1975e05377cbd2d93e62df2309f9b88" ] && [ "$agent_tag" = v0.30.00 ]; then break; fi
            sleep 10
          done
          test "$agent_sha" = "718ff36ee1975e05377cbd2d93e62df2309f9b88"
          test "$agent_tag" = v0.30.00
          if gh release view v0.30.06 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.30.06 release-dist/* --target "$GITHUB_SHA" --title "Nezha v0.30.06" --notes-file RELEASE_V03006.md --latest
