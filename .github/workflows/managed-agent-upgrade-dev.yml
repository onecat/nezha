name: Dashboard v0.30.07 - configuration and security checks
on:
  push:
    branches: [config-v0.30.07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-verification:
    if: github.ref_name == 'config-v0.30.07'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify package security and offline tool
        run: |
          go test -race -count=1 -v ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
          go vet ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
  dashboard-storage:
    if: github.ref_name == 'config-v0.30.07'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify real SQLite task persistence
        run: |
          go test -race -count=1 -v ./service/agentupgrade
          go vet ./service/agentupgrade ./service/upgradecontrol
          go test -count=1 ./cmd/dashboard/controller ./service/upgradecontrol
          go build ./cmd/dashboard

  joint-upgrade:
    if: github.ref_name == 'config-v0.30.07'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: onecat/nezha-agent
          ref: 718ff36ee1975e05377cbd2d93e62df2309f9b88
          path: joint-agent
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor exact frontend assets before candidate build
        run: python3 script/vendor-assets.py
      - name: Install isolated test proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils
      - name: Build exact paired source revisions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/joint-bin"
          go build -mod=readonly -trimpath -ldflags="-X github.com/naiba/nezha/service/singleton.Version=v0.30.07" -o "$RUNNER_TEMP/joint-bin/dashboard" ./cmd/dashboard
          test "$("$RUNNER_TEMP/joint-bin/dashboard" -v)" = v0.30.07
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/agent-package" ./cmd/agent-package
          cd joint-agent
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/supervisor" ./cmd/supervisor
          for version in v0.30.00 v0.30.01 v0.30.03; do
            go build -mod=readonly -ldflags="-X main.version=$version" -o "$RUNNER_TEMP/joint-bin/agent-$version" ./cmd/agent
          done
      - name: Actual Dashboard and Supervisor over TLS
        run: python3 script/managed-upgrade-joint.py "$RUNNER_TEMP/joint-bin" "$(go env GOARCH)"
      - name: Stage exact tested Dashboard binary
        run: |
          set -eu
          mkdir -p dist
          install -m 0755 "$RUNNER_TEMP/joint-bin/dashboard" dist/nezha-app
          test "$(dist/nezha-app -v)" = v0.30.07
          (cd dist && sha256sum nezha-app > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nezha-verified-linux-amd64
          path: dist/
          if-no-files-found: error

  security-regression:
    if: github.ref_name == 'config-v0.30.07'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned frontend assets
        run: python3 script/vendor-assets.py
      - name: Verify module integrity and lock
        run: |
          go mod verify
          go mod tidy -diff
      - name: Full regression and vet
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Reachable Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Frontend advisory disposition
        run: |
          python3 script/audit-frontend.py || test -s frontend-audit.json
          python3 script/check-frontend-disposition.py

  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/config-v0.30.07' && github.event.head_commit.message == 'release: qualify and publish Dashboard v0.30.07'
    needs: [package-verification, dashboard-storage, joint-upgrade, security-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nezha-verified-linux-amd64
          path: release-dist
      - name: Verify exact tested Dashboard binary
        run: |
          chmod +x release-dist/nezha-app
          test "$(release-dist/nezha-app -v)" = v0.30.07
          (cd release-dist && sha256sum -c SHA256SUMS)
      - name: Confirm matching Agent release and publish Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # No cross-repository write token; verify the independent public release.
          for attempt in $(seq 1 30); do
            agent_sha=$(gh api repos/onecat/nezha-agent/git/ref/tags/v0.30.00 --jq '.object.sha' 2>/dev/null || true)
            agent_tag=$(gh api repos/onecat/nezha-agent/releases/tags/v0.30.00 --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)
            if [ "$agent_sha" = "718ff36ee1975e05377cbd2d93e62df2309f9b88" ] && [ "$agent_tag" = v0.30.00 ]; then break; fi
            sleep 10
          done
          test "$agent_sha" = "718ff36ee1975e05377cbd2d93e62df2309f9b88"
          test "$agent_tag" = v0.30.00
          if gh release view v0.30.07 >/dev/null 2>&1; then
            # An already-running release from the identical program source
            # may finish before this CI-only revision. Never overwrite it.
            existing=$(gh api repos/onecat/nezha/git/ref/tags/v0.30.07 --jq '.object.sha')
            case "$existing" in
              "7430fbf572ba10c2c6beaf80865acf7693a3e9ac"|"$GITHUB_SHA") ;;
              *) echo "Unexpected existing release tag"; exit 1 ;;
            esac
            assets=$(gh api repos/onecat/nezha/releases/tags/v0.30.07 --jq '.assets[].name' | sort)
            test "$assets" = "$(printf 'SHA256SUMS\nnezha-app\n')"
            echo "Equivalent release already published; preserving original tag and assets"
            exit 0
          fi
          gh release create v0.30.07 release-dist/nezha-app release-dist/SHA256SUMS --target "$GITHUB_SHA" --title "Nezha v0.30.07" --notes-file RELEASE_V03007.md --latest
