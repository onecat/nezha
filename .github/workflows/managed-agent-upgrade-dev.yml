name: Managed Agent upgrade - development checks
on:
  push:
    branches: [agent-upgrade-v0.30.06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-verification:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify package security and offline tool
        run: |
          go test -race -count=1 -v ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
          go vet ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
  dashboard-storage:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify real SQLite task persistence
        run: |
          go test -race -count=1 -v ./service/agentupgrade
          go vet ./service/agentupgrade ./service/upgradecontrol
          go test -count=1 ./cmd/dashboard/controller ./service/upgradecontrol
          go build ./cmd/dashboard

  joint-upgrade:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: onecat/nezha-agent
          ref: b449c09a518d5466ec860682b85a8657d21e706b
          path: joint-agent
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor exact frontend assets before candidate build
        run: python3 script/vendor-assets.py
      - name: Install isolated test proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils
      - name: Build exact paired source revisions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/joint-bin"
          go build -mod=readonly -trimpath -ldflags="-X github.com/naiba/nezha/service/singleton.Version=v0.30.06-rc" -o "$RUNNER_TEMP/joint-bin/dashboard" ./cmd/dashboard
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/agent-package" ./cmd/agent-package
          cd joint-agent
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/supervisor" ./cmd/supervisor
          for version in v0.30.00 v0.30.01 v0.30.03; do
            go build -mod=readonly -ldflags="-X main.version=$version" -o "$RUNNER_TEMP/joint-bin/agent-$version" ./cmd/agent
          done
      - name: Actual Dashboard and Supervisor over TLS
        run: python3 script/managed-upgrade-joint.py "$RUNNER_TEMP/joint-bin" "$(go env GOARCH)"
      - name: Stage exact tested candidate binaries (unsigned)
        run: |
          set -eu
          arch=$(go env GOARCH)
          mkdir -p candidate
          cp "$RUNNER_TEMP/joint-bin/dashboard" candidate/nezha-dashboard
          cp "$RUNNER_TEMP/joint-bin/agent-package" candidate/agent-package
          cp "$RUNNER_TEMP/joint-bin/supervisor" candidate/nezha-supervisor
          cp "$RUNNER_TEMP/joint-bin/agent-v0.30.00" candidate/nezha-agent-v0.30.00
          cp "$RUNNER_TEMP/joint-bin/agent-v0.30.01" candidate/nezha-agent-v0.30.01
          cp joint-agent/deploy/nezha-supervisor.service candidate/
          cp joint-agent/docs/linux-deployment.md candidate/
          cp docs/managed-upgrade-control.md docs/managed-upgrade-proxy.md candidate/
          cp LICENSE candidate/LICENSE-dashboard
          cp joint-agent/LICENSE candidate/LICENSE-agent
          printf 'Dashboard=%s\nAgent=%s\nPlatform=linux/%s\nGo=%s\n' "$GITHUB_SHA" "$(git -C joint-agent rev-parse HEAD)" "$arch" "$(go version)" > candidate/SOURCES.txt
          (cd candidate && sha256sum * > SHA256SUMS)
          tar -C candidate -czf "nezha-test-candidate-linux-$arch.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-test-candidate-${{ matrix.os }}
          path: nezha-test-candidate-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  security-regression:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned frontend assets
        run: python3 script/vendor-assets.py
      - name: Verify module integrity and lock
        run: |
          go mod verify
          go mod tidy -diff
      - name: Full regression and vet
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Reachable Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Frontend advisory disposition
        run: |
          python3 script/audit-frontend.py || test -s frontend-audit.json
          python3 script/check-frontend-disposition.py
