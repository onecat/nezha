name: Dashboard v0.30.11 - configuration and security checks
on:
  push:
    branches: [static-agent-v0.30.11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-verification:
    if: github.ref_name == 'static-agent-v0.30.11'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify package security and offline tool
        run: |
          go test -race -count=1 -v ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
          go vet ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
  dashboard-storage:
    if: github.ref_name == 'static-agent-v0.30.11'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify real SQLite task persistence
        run: |
          go test -race -count=1 -v ./service/agentupgrade
          go vet ./service/agentupgrade ./service/upgradecontrol
          go test -count=1 ./cmd/dashboard/controller ./service/upgradecontrol
          go build ./cmd/dashboard

  joint-upgrade:
    if: github.ref_name == 'static-agent-v0.30.11'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: onecat/nezha-agent
          ref: b4a78fd5dc44e22b57aec5587ce53bbca96f0307
          path: joint-agent
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor exact frontend assets before candidate build
        run: python3 script/vendor-assets.py
      - name: Install isolated test proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils
      - name: Verify independent Agent release before embedding its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/agent-release"
          cd "$RUNNER_TEMP/agent-release"
          for attempt in $(seq 1 120); do
            tag=$(gh api repos/onecat/nezha-agent/git/ref/tags/v0.30.04 --jq '.object.sha' 2>/dev/null || true)
            if [ "$tag" = "b4a78fd5dc44e22b57aec5587ce53bbca96f0307" ] && curl -fsSL --max-time 15 https://github.com/onecat/nezha-agent/releases/download/v0.30.04/SHA256SUMS -o SHA256SUMS; then break; fi
            sleep 10
          done
          test "$tag" = "b4a78fd5dc44e22b57aec5587ce53bbca96f0307"
          test "$(wc -l < SHA256SUMS)" = 1
          grep -Ex '[0-9a-f]{64}  nezha-agent' SHA256SUMS
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 180 https://github.com/onecat/nezha-agent/releases/download/v0.30.04/nezha-agent -o nezha-agent
          sha256sum -c SHA256SUMS
          chmod 700 nezha-agent
          test "$(./nezha-agent --version)" = v0.30.04
          bash "$GITHUB_WORKSPACE/joint-agent/script/check-static-agent.sh" "$PWD/nezha-agent" v0.30.04
          echo "AGENT_INSTALL_SHA256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/joint-bin"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 180 https://github.com/onecat/nezha-agent/releases/download/v0.30.03/nezha-agent -o "$RUNNER_TEMP/joint-bin/agent-v0.30.03-release"
          printf '%s  %s\n' 'bae8af9bf9ff07963e5dfa9c9cdf952678ac778591b312ce06822b85a37f9db7' "$RUNNER_TEMP/joint-bin/agent-v0.30.03-release" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/joint-bin/agent-v0.30.03-release"
          test "$("$RUNNER_TEMP/joint-bin/agent-v0.30.03-release" --version)" = v0.30.03
      - name: Build exact paired source revisions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/joint-bin"
          go build -mod=readonly -trimpath -ldflags="-X github.com/naiba/nezha/service/singleton.Version=v0.30.11 -X github.com/naiba/nezha/cmd/dashboard/controller.agentInstallSHA256=$AGENT_INSTALL_SHA256" -o "$RUNNER_TEMP/joint-bin/dashboard" ./cmd/dashboard
          test "$("$RUNNER_TEMP/joint-bin/dashboard" -v)" = v0.30.11
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/agent-package" ./cmd/agent-package
          cd joint-agent
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/supervisor" ./cmd/supervisor
          for version in v0.30.00 v0.30.01 v0.30.02 v0.30.03; do
            CGO_ENABLED=0 GOAMD64=v1 go build -mod=readonly -tags=netgo,osusergo -ldflags="-X main.version=$version" -o "$RUNNER_TEMP/joint-bin/agent-$version" ./cmd/agent
          done
      - name: Actual Dashboard and Supervisor over TLS
        run: python3 script/managed-upgrade-joint.py "$RUNNER_TEMP/joint-bin" "$(go env GOARCH)"
      - name: Verify real URL upgrade from Agent release
        run: |
          NZ_JOINT_INSTALLER=1 NZ_JOINT_URL=1 python3 script/managed-upgrade-joint.py "$RUNNER_TEMP/joint-bin" "$(go env GOARCH)"
      - name: Stage exact tested Dashboard binary
        run: |
          set -eu
          mkdir -p dist
          install -m 0755 "$RUNNER_TEMP/joint-bin/dashboard" dist/nezha-app
          test "$(dist/nezha-app -v)" = v0.30.11
          (cd dist && sha256sum nezha-app > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nezha-verified-linux-amd64
          path: dist/
          if-no-files-found: error

  security-regression:
    if: github.ref_name == 'static-agent-v0.30.11'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned frontend assets
        run: python3 script/vendor-assets.py
      - name: Verify module integrity and lock
        run: |
          go mod verify
          go mod tidy -diff
      - name: Full regression and vet
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Reachable Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Frontend advisory disposition
        run: |
          python3 script/audit-frontend.py || test -s frontend-audit.json
          python3 script/check-frontend-disposition.py

  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/static-agent-v0.30.11' && github.event.head_commit.message == 'release: qualify and publish Dashboard v0.30.11'
    needs: [package-verification, dashboard-storage, joint-upgrade, security-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nezha-verified-linux-amd64
          path: release-dist
      - name: Verify exact tested Dashboard binary
        run: |
          chmod +x release-dist/nezha-app
          test "$(release-dist/nezha-app -v)" = v0.30.11
          (cd release-dist && sha256sum -c SHA256SUMS)
      - name: Confirm matching Agent release and publish Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # No cross-repository write token; verify the independent public release.
          for attempt in $(seq 1 30); do
            agent_sha=$(gh api repos/onecat/nezha-agent/git/ref/tags/v0.30.04 --jq '.object.sha' 2>/dev/null || true)
            agent_tag=$(gh api repos/onecat/nezha-agent/releases/tags/v0.30.04 --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)
            if [ "$agent_sha" = "b4a78fd5dc44e22b57aec5587ce53bbca96f0307" ] && [ "$agent_tag"  = v0.30.04 ]; then break; fi
            sleep 10
          done
          test "$agent_sha" = "b4a78fd5dc44e22b57aec5587ce53bbca96f0307"
          test "$agent_tag"  = v0.30.04
          if gh release view v0.30.11 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.30.11 release-dist/nezha-app release-dist/SHA256SUMS --target "$GITHUB_SHA" --title "Nezha v0.30.11" --notes-file RELEASE_V03011.md --latest
