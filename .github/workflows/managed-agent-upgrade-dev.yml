name: Managed Agent upgrade - development checks
on:
  push:
    branches: [agent-upgrade-v0.30.06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-verification:
    if: >-
      github.ref_name == 'agent-upgrade-v0.30.06' && github.event.head_commit.message != 'release: remove redundant Dashboard release assets'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify package security and offline tool
        run: |
          go test -race -count=1 -v ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
          go vet ./pkg/agentupgrade ./pkg/upgradewire ./cmd/agent-package
  dashboard-storage:
    if: >-
      github.ref_name == 'agent-upgrade-v0.30.06' && github.event.head_commit.message != 'release: remove redundant Dashboard release assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify real SQLite task persistence
        run: |
          go test -race -count=1 -v ./service/agentupgrade
          go vet ./service/agentupgrade ./service/upgradecontrol
          go test -count=1 ./cmd/dashboard/controller ./service/upgradecontrol
          go build ./cmd/dashboard

  joint-upgrade:
    if: >-
      github.ref_name == 'agent-upgrade-v0.30.06' && github.event.head_commit.message != 'release: remove redundant Dashboard release assets'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: onecat/nezha-agent
          ref: 718ff36ee1975e05377cbd2d93e62df2309f9b88
          path: joint-agent
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor exact frontend assets before candidate build
        run: python3 script/vendor-assets.py
      - name: Install isolated test proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils
      - name: Build exact paired source revisions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/joint-bin"
          go build -mod=readonly -trimpath -ldflags="-X github.com/naiba/nezha/service/singleton.Version=v0.30.06" -o "$RUNNER_TEMP/joint-bin/dashboard" ./cmd/dashboard
          test "$("$RUNNER_TEMP/joint-bin/dashboard" -v)" = v0.30.06
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/agent-package" ./cmd/agent-package
          cd joint-agent
          go build -mod=readonly -o "$RUNNER_TEMP/joint-bin/supervisor" ./cmd/supervisor
          for version in v0.30.00 v0.30.01 v0.30.03; do
            go build -mod=readonly -ldflags="-X main.version=$version" -o "$RUNNER_TEMP/joint-bin/agent-$version" ./cmd/agent
          done
      - name: Actual Dashboard and Supervisor over TLS
        run: python3 script/managed-upgrade-joint.py "$RUNNER_TEMP/joint-bin" "$(go env GOARCH)"
      - name: Stage exact tested Dashboard binary
        if: runner.arch == 'X64'
        run: |
          set -eu
          mkdir -p dist
          install -m 0755 "$RUNNER_TEMP/joint-bin/dashboard" dist/nezha-app
          test "$(dist/nezha-app -v)" = v0.30.06
          (cd dist && sha256sum nezha-app > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: runner.arch == 'X64'
        with:
          name: nezha-verified-linux-amd64
          path: dist/
          if-no-files-found: error

  security-regression:
    if: >-
      github.ref_name == 'agent-upgrade-v0.30.06' && github.event.head_commit.message != 'release: remove redundant Dashboard release assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned frontend assets
        run: python3 script/vendor-assets.py
      - name: Verify module integrity and lock
        run: |
          go mod verify
          go mod tidy -diff
      - name: Full regression and vet
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Reachable Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Frontend advisory disposition
        run: |
          python3 script/audit-frontend.py || test -s frontend-audit.json
          python3 script/check-frontend-disposition.py

  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/agent-upgrade-v0.30.06' && github.event.head_commit.message == 'release: qualify and publish Dashboard v0.30.06'
    needs: [package-verification, dashboard-storage, joint-upgrade, security-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nezha-verified-linux-amd64
          path: release-dist
      - name: Verify exact tested Dashboard binary
        run: |
          chmod +x release-dist/nezha-app
          test "$(release-dist/nezha-app -v)" = v0.30.06
          (cd release-dist && sha256sum -c SHA256SUMS)
      - name: Confirm matching Agent release and publish Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # No cross-repository write token; verify the independent public release.
          for attempt in $(seq 1 30); do
            agent_sha=$(gh api repos/onecat/nezha-agent/git/ref/tags/v0.30.00 --jq '.object.sha' 2>/dev/null || true)
            agent_tag=$(gh api repos/onecat/nezha-agent/releases/tags/v0.30.00 --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)
            if [ "$agent_sha" = "718ff36ee1975e05377cbd2d93e62df2309f9b88" ] && [ "$agent_tag" = v0.30.00 ]; then break; fi
            sleep 10
          done
          test "$agent_sha" = "718ff36ee1975e05377cbd2d93e62df2309f9b88"
          test "$agent_tag" = v0.30.00
          if gh release view v0.30.06 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.30.06 release-dist/nezha-app release-dist/SHA256SUMS --target "$GITHUB_SHA" --title "Nezha v0.30.06" --notes-file RELEASE_V03006.md --latest

  cleanup-v03006-assets:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/agent-upgrade-v0.30.06' && github.event.head_commit.message == 'release: remove redundant Dashboard release assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove only the three redundant release assets and synchronize checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          test "$GH_REPO" = onecat/nezha
          test "$(gh api repos/onecat/nezha/git/ref/tags/v0.30.06 --jq '.object.sha')" = "b45afc9ed48dcb8e8b966cec69f64a223dae4b56"
          release=$(gh api repos/onecat/nezha/releases/tags/v0.30.06)
          test "$(jq -r '.id' <<< "$release")" = 460133455
          test "$(jq -r '.assets[] | select(.name=="nezha-app") | .id' <<< "$release")" = 798811431
          test "$(jq -r '.assets[] | select(.name=="nezha-app") | .digest' <<< "$release")" = sha256:7ab18026b71d2daadf5dd9f1f2b2381ab5fe7620c2923234acd93bd5e9cb208b
          # Refuse to modify any unexpected release asset.
          for item in "798811424:managed-upgrade-v0.30.06-linux-amd64.tar.gz" "798811422:managed-upgrade-v0.30.06-linux-arm64.tar.gz" "798811425:nezha-app-linux-arm64"; do
            id=${item%%:*}
            name=${item#*:}
            actual=$(jq -r --arg name "$name" '.assets[] | select(.name==$name) | .id' <<< "$release")
            if [ -n "$actual" ]; then
              test "$actual" = "$id"
              gh release delete-asset v0.30.06 "$name" --yes
            fi
          done
          temp=$(mktemp -d)
          printf '%s  nezha-app\n' 7ab18026b71d2daadf5dd9f1f2b2381ab5fe7620c2923234acd93bd5e9cb208b > "$temp/SHA256SUMS"
          gh release upload v0.30.06 "$temp/SHA256SUMS" --clobber
          gh release edit v0.30.06 --notes-file RELEASE_V03006.md
          gh release download v0.30.06 --pattern SHA256SUMS --dir "$temp/check"
          cmp "$temp/SHA256SUMS" "$temp/check/SHA256SUMS"
          actual=$(gh api repos/onecat/nezha/releases/tags/v0.30.06)
          test "$(jq -r '.assets[].name' <<< "$actual" | sort)" = "$(printf 'SHA256SUMS\nnezha-app\n')"
          test "$(jq -r '.assets[] | select(.name=="nezha-app") | .id' <<< "$actual")" = 798811431
          test "$(jq -r '.assets[] | select(.name=="nezha-app") | .digest' <<< "$actual")" = sha256:7ab18026b71d2daadf5dd9f1f2b2381ab5fe7620c2923234acd93bd5e9cb208b
          test "$(gh api repos/onecat/nezha/git/ref/tags/v0.30.06 --jq '.object.sha')" = "b45afc9ed48dcb8e8b966cec69f64a223dae4b56"
          echo "Release contains only nezha-app and SHA256SUMS; original binary and tag preserved."
