name: Managed Agent upgrade - development checks
on:
  push:
    branches: [agent-upgrade-v0.30.06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-verification:
    if: github.ref_name == 'agent-upgrade-v0.30.06'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify package security and offline tool
        run: |
          go test -race -count=1 -v ./pkg/agentupgrade ./cmd/agent-package
          go vet ./pkg/agentupgrade ./cmd/agent-package
