name: Nezha v0.30.05 - Development CI
on:
  push:
    branches: [security-v0.30.05]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-v03005-${{ github.ref }}
  cancel-in-progress: true
jobs:

  resolve-dependencies:
    if: github.ref_name == 'security-v0.30.05'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Resolve security dependency upgrades
        run: |
          bash script/resolve-security-deps.sh
          go mod verify
          go list -m all
          echo 'BEGIN_GO_MOD'
          cat go.mod
          echo 'END_GO_MOD'
          echo 'BEGIN_GO_SUM'
          cat go.sum
          echo 'END_GO_SUM'
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-go-modules
          path: |
            go.mod
            go.sum
          if-no-files-found: error
  verify:
    needs: resolve-dependencies
    if: github.ref_name == 'security-v0.30.05'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: resolved-go-modules
      - name: Go toolchain and embedded frontend
        run: |
          go version
          python3 script/vendor-assets.py
      - name: Module integrity
        run: go mod verify
      - name: Run all tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...
      - name: Build development binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w -X github.com/naiba/nezha/service/singleton.Version=v0.30.05-dev' -o dist/nezha-app ./cmd/dashboard
          test "$(dist/nezha-app -v)" = 'v0.30.05-dev'
          (cd dist && sha256sum nezha-app > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nezha-v0.30.05-dev
          path: dist/
          if-no-files-found: error
  vulnerability-scan:
    needs: resolve-dependencies
    if: github.ref_name == 'security-v0.30.05'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: resolved-go-modules
      - run: python3 script/vendor-assets.py
      - name: Scan reachable Go vulnerabilities
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... 2>&1 | tee govulncheck.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-report
          path: govulncheck.txt
          if-no-files-found: warn
