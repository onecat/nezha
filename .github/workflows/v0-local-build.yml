name: Nezha v0.30.05 - Development CI
on:
  push:
    branches: [security-v0.30.05]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-v03005-${{ github.ref }}
  cancel-in-progress: false
jobs:


  verify:
    if: github.ref_name == 'security-v0.30.05'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Go toolchain and embedded frontend
        run: |
          go version
          python3 script/vendor-assets.py
      - name: Module integrity
        run: |
          go mod verify
          go mod tidy -diff
      - name: Run all tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...
      - name: Build development binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w -X github.com/naiba/nezha/service/singleton.Version=v0.30.05-dev' -o dist/nezha-app ./cmd/dashboard
          test "$(dist/nezha-app -v)" = 'v0.30.05-dev'
          (cd dist && sha256sum nezha-app > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nezha-v0.30.05-dev
          path: dist/
          if-no-files-found: error
  vulnerability-scan:
    if: github.ref_name == 'security-v0.30.05'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - run: python3 script/vendor-assets.py
      - name: Scan reachable Go vulnerabilities
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... 2>&1 | tee govulncheck.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-report
          path: govulncheck.txt
          if-no-files-found: warn
  frontend-audit:
    if: github.ref_name == 'security-v0.30.05'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 script/vendor-assets.py
      - name: Check generated Bootstrap subset syntax
        run: node --check resource/static/vendor/bootstrap-3.4.1/dist/js/bootstrap-server-status.js
      - name: Audit exact embedded npm package versions
        run: python3 script/audit-frontend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-audit
          path: |
            .frontend-packages.json
            frontend-audit.json
          include-hidden-files: true
          if-no-files-found: warn
  browser-smoke:
    needs: verify
    if: github.ref_name == 'security-v0.30.05'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nezha-v0.30.05-dev
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2-utils
          npm install --prefix "$RUNNER_TEMP/nezha-browser" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/nezha-browser/node_modules/.bin/playwright" install --with-deps chromium
          chmod +x dist/nezha-app
      - name: Start local Dashboard and test offline pages
        run: |
          set -eu
          work=$(mktemp -d)
          password=$(openssl rand -hex 18)
          hash=$(htpasswd -nbBC 5 smoke "$password" | cut -d: -f2-)
          printf 'httpport: 18008\ngrpcport: 15555\nlanguage: en-US\nlocalauth:\n  username: smoke\n  passwordhash: "%s"\nsite:\n  brand: Nezha Smoke\n  theme: default\n' "$hash" > "$work/config.yaml"
          bin="$PWD/dist/nezha-app"
          (cd "$work" && exec "$bin" -c "$work/config.yaml" --db "$work/smoke.db") > dashboard-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18008/login >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18008/login >/dev/null
          NODE_PATH="$RUNNER_TEMP/nezha-browser/node_modules" SMOKE_PASSWORD="$password" node script/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-report
          path: |
            dashboard-smoke.log
            browser-smoke.json
          if-no-files-found: warn
