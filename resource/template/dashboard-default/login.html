{{define "dashboard-default/login"}}
{{template "common/header" .}}
<div class="login nb-container">
  <div class="ui center aligned grid">
    <div class="column">
      <h2 class="ui image header">
        <img src="/static/logo.svg?v20210804" class="image">
        <div class="content">管理员登录</div>
      </h2>
      {{if .LoginError}}<div class="ui negative message">账号或密码错误</div>{{end}}
      <form class="ui large form" method="post" action="/local/login" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="field"><div class="ui left icon input">
          <i class="user icon"></i>
          <input type="text" name="username" placeholder="用户名" autocomplete="username" required maxlength="128">
        </div></div>
        <div class="field"><div class="ui left icon input">
          <i class="lock icon"></i>
          <input type="password" name="password" placeholder="密码" autocomplete="current-password" required>
        </div></div>
        <button class="ui fluid large nezha-primary-btn submit button" type="submit">登录</button>
      </form>
    </div>
  </div>
</div>
{{template "common/footer" .}}
{{end}}
